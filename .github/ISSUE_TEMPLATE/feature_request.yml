name: 要望 / Feature request
description: 欲しい機能や改善を提案する / Suggest a feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        次は**実装しません。** 提案されても取り込めません。
        These are **deliberately out of scope** and cannot be accepted:

        - 顔の検出・顔の切り出し・人物の特定 / Face detection, face cropping, identifying people
        - 動画のダウンロード / Downloading video
        - アプリ独自のテレメトリ / Telemetry
        - 履歴に画像のサムネイルを持つこと / Thumbnails in the history

  - type: textarea
    id: problem
    attributes:
      label: 困っていることは何ですか / What problem are you running into
      description: |
        **解決したい状況**を書いてください。先に「どう直すか」ではなく、困りごとから。
        Describe **the situation**, rather than the fix you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: こうなるとよい、という案 / What you have in mind

  - type: textarea
    id: alternatives
    attributes:
      label: いま代わりにしていること / What you do instead today
